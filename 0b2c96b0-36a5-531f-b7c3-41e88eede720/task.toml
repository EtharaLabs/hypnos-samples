[task]
name = "etharaorion/nushell-call-by-decl-id-as-direct-call"
version = "1.0.0"
description = "Make every call by declaration id, a plugin's call_decl, the open, http, and save converters, the highlighter and table renderer nushell picks, and %($cmd), behave as the same direct call for custom commands: arguments, flags, and defaults bound, input type checked, and $env contained unless def --env, while calls accepted today stay accepted."
authors = [{ name = "adarsh.mishraint17", email = "adarsh.mishraint17@ethara.ai" }]
