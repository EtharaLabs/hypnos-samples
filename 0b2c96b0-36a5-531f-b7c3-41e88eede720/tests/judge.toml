# Judged rubric item R8 over the submission diff. tests/test.sh runs Reward Kit, and so this
# judge, only when the reward gate is open.
[judge]
judge = "anthropic/claude-sonnet-5-5"
files = ["/logs/verifier/submission.diff"]
mode = "batched"
timeout = 300

[[criterion]]
id = "R8"
name = "R8"
description = "The change makes calls by declaration id behave as direct calls only for particular command names, converter names, or inputs, rather than for every custom command"
type = "binary"
weight = 3
negate = true
[criterion.annotations]
mode = "judged"
number = "R8"
obligation = "D1"
dimension = "constraints"
evaluation_target = "/logs/verifier/submission.diff"
is_positive = false
importance = "important"

[scoring]
aggregation = "weighted-mean"
