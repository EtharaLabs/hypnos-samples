<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="t d">
  <title id="t">Lethe, river of forgetting</title>
  <desc id="d">A veiled goddess stands in the still black water of Lethe, winding through a field of asphodel beneath the open hand of a sleeping god. Her poured water erases the reflection of a repository that no longer remembers the fix that healed it. Nine poppies stand along the far bank, one for each language of the corpus, and five attendant artifacts wait at the water's edge.</desc>

