[task]
name = "ethara/abf4e028-0a14-59f3-8d81-456c03830eea"
version = "1.0.0"
description = "Make SWC's TypeScript transform give namespace, enum and import-alias declarations, single or merged from several bodies, exactly the runtime behaviour of the JavaScript tsc emits: names in one body resolve to members any body of the same declaration exports before outer bindings, the same namespace and enum objects exist with the same members and values, and enum members evaluate as tsc evaluates them, while everything that works today keeps working."
authors = [{ name = "adarsh.mishraint17", email = "adarsh.mishraint17@ethara.ai" }]
keywords = ["rust", "swc", "typescript", "namespaces", "enums", "declaration-merging", "issue-resolution", "rewardkit"]

